version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: "deps"
      include: scope
    ignore:
      # TypeScript 7 drops the JS compiler API that scripts/jsdoc-gate.mjs and
      # scripts/checks/sqlite-sql-safety.mjs parse with (7.0 offers it only
      # under typescript/unstable/*). Stay on 6.x until they are ported
      # (Director, 2026-09-24).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      typescript-toolchain:
        patterns:
          - "typescript"
          - "@types/*"
      stryker:
        patterns:
          - "@stryker-mutator/*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      mcp-sdk:
        patterns:
          - "@modelcontextprotocol/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci(deps)"
