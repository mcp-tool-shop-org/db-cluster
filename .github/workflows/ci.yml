# --- Measured CI cost (dogfood-swarm SKILL item 8) --------------------------
# 14-18 billable min per run (4 jobs), measured from runs 35999888689 and
# 35999892702 on 2026-09-24, after the Node 20 cells came out (end-of-life;
# engines >=22.12). Each Linux job billed 2 min, each Windows job 4-8.
# Before that: ~29 (6 jobs), derived from run 34123484614
# on 2026-09-07, which cost 119 min across 9 jobs BEFORE the macOS cells
# came out. 3 macOS cells (node 20/22/24) each ran ~2.3 min of wall time and each billed 30 min at the x10 macOS rate.
# This package ships to npm and publishes no darwin artifact, so those cells
# tested a platform nothing is released for. Studio rule: never macos-latest
# unless explicitly requested (.claude/rules/github-actions.md). Windows stays -
# path handling and file locking genuinely differ there.
# GitHub bills per JOB, rounded UP to the minute, x2 Windows / x10 macOS, so
# billable minutes exceed wall time. Re-measure, never estimate:
#   gh api repos/mcp-tool-shop-org/db-cluster/actions/runs/<id>/jobs
# ---------------------------------------------------------------------------
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to test (default: HEAD)'
        required: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Node 20 left 2026-09-24: it reached end-of-life on 2026-04-30, and
        # engines.node is >=22.12 (commander 15 and better-sqlite3 13 need it).
        node: [22, 24]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # 'true' on the one leg whose coverage and test results go to Codecov,
      # on a pull request or a push to the default branch.
      COVERAGE_LEG: ${{ matrix.node == 22 && matrix.os == 'ubuntu-latest' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      # Atlas requires Node 22 or later, and one cell is enough, so the check
      # runs on the Node 22 Linux cell only.
      - name: Atlas check
        if: matrix.node == 22 && matrix.os == 'ubuntu-latest'
        run: npx --yes @dogfood-lab/atlas@1.15.0 check
      # --ignore-scripts keeps the SQLite driver. better-sqlite3 13 bundles
      # prebuilt binaries but also ships a binding.gyp, and `npm ci` (which
      # installs from the lockfile, where the package's `gypfile: false` is not
      # recorded) runs an implicit `node-gyp rebuild` for it. Where that cannot
      # compile - npm 10's node-gyp does not recognise the Windows runners'
      # Visual Studio - npm deletes the optional package, working binary and
      # all, and the SQLite suites skip instead of failing. @ast-grep/cli is
      # the only dependency whose install script this job needs.
      - run: npm ci --ignore-scripts
      - run: npm rebuild @ast-grep/cli
      # Build first — `lint:examples` resolves `db-cluster`, `db-cluster/sdk`,
      # `db-cluster/policy` (self-reference via package.json `exports`), which
      # requires dist/ to be populated. Without a prior build, tsc cannot
      # resolve the self-reference and the example typecheck fails with
      # TS2307 across every example file. Run order: build → lint → test.
      - run: npm run build
      - run: npm run lint
      - id: tests
        run: npm test -- --coverage.enabled=${{ env.COVERAGE_LEG == 'true' }} --reporter=default --reporter=junit --outputFile.junit=junit.xml
        env:
          # A missing SQLite driver fails the run instead of skipping the
          # SQLite suites (test/sqlite-driver-presence.test.ts).
          DB_CLUSTER_REQUIRE_SQLITE: '1'
      # The codecov job below uploads what these two steps save; this job
      # never holds an OIDC token. Coverage is saved when the tests passed,
      # and test results whenever they ran, failures included, because a
      # failing test is what that report exists to show. A save step with no
      # file to save fails the job. overwrite lets a re-run of this job
      # replace the artifact its earlier attempt saved.
      - name: Save coverage for Codecov
        if: ${{ env.COVERAGE_LEG == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-coverage
          path: coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 3
          overwrite: true
      - name: Save test results for Codecov
        if: ${{ !cancelled() && env.COVERAGE_LEG == 'true' && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-test-results
          path: junit.xml
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  codecov:
    # Uploads what the test job saved, from a job of its own, so the OIDC
    # token that signs in to Codecov never exists beside the install and the
    # tests. The checkout, which keeps no token, is there only so Codecov can
    # match report paths to files: the job installs nothing and runs none of
    # the repository's code. It runs whenever the test job ran, failures
    # included, so failing tests still reach Codecov, and only on the events
    # that collect coverage. A run the concurrency group cancels uploads
    # nothing, and each run reads only its own artifacts.
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'cancelled' && needs.test.result != 'skipped' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Each artifact unpacks where the test job wrote its files. A pattern
      # that matches nothing, unlike a name, does not fail: a failing test
      # run saves test results and no coverage.
      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codecov-coverage
          path: coverage
      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codecov-test-results
          path: .
      # After a passing test job both artifacts exist, so each upload runs,
      # and fails the job if its files are missing; after a failing one each
      # runs when its files arrived. Both sign in with OIDC, fail the job when
      # Codecov refuses the report, and run the Codecov CLI at a fixed version
      # rather than whichever is newest.
      - name: Upload coverage to Codecov
        if: ${{ needs.test.result == 'success' || hashFiles('coverage/coverage-final.json') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          files: ./coverage/coverage-final.json
      - name: Upload test results to Codecov
        if: ${{ needs.test.result == 'success' || hashFiles('junit.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          report_type: test_results
          disable_search: true
          files: ./junit.xml
