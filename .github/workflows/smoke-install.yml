name: Smoke Install
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['package.json']
  workflow_dispatch:
permissions:
  contents: read

# Supersede an in-flight run when a newer commit lands on the same ref.
# head_ref names the PR branch on pull_request and is empty elsewhere, so a
# push and its PR run share one group instead of both going to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm pack       # creates mcptoolshop-db-cluster-<version>.tgz for the smoke script
      - run: node scripts/smoke-install.mjs
